# Reusable CI pipeline for all client website projects.
#
# Contract: the calling project must provide these package.json scripts:
#   lint, typecheck, test, build, and (if run-e2e is true) test:e2e
#
# Design notes:
# - GitHub bills every job rounded up to a full minute and every job pays the
#   dependency install again. All quality checks therefore share one job and
#   run fail-fast in order of cost; only the security scans run in parallel.
# - Third-party actions are pinned to full commit SHAs, tools to versions
#   and checksums.
name: CI (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains package.json, relative to the repository root.
        type: string
        default: "."
      node-version-file:
        description: File that defines the Node.js version, relative to working-directory.
        type: string
        default: ".nvmrc"
      run-e2e:
        description: Run Playwright end-to-end tests (script "test:e2e").
        type: boolean
        default: true
      playwright-browsers:
        description: Space-separated list of Playwright browsers to install.
        type: string
        default: "chromium"
      audit-level:
        description: Minimum severity that fails the dependency audit (low, moderate, high, critical).
        type: string
        default: "high"
      run-semgrep:
        description: Run the Semgrep static security analysis.
        type: boolean
        default: true
      semgrep-config:
        description: Space-separated list of Semgrep rule sets.
        type: string
        default: "p/typescript p/react p/nextjs p/owasp-top-ten"

permissions: {}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}-

      - name: Build
        run: pnpm run build

      - name: Resolve Playwright version
        if: inputs.run-e2e
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        if: inputs.run-e2e
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.playwright-browsers }}

      - name: Install Playwright browsers
        if: inputs.run-e2e && steps.playwright-cache.outputs.cache-hit != 'true'
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          read -r -a browsers <<< "$BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Install Playwright system dependencies
        if: inputs.run-e2e && steps.playwright-cache.outputs.cache-hit == 'true'
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          read -r -a browsers <<< "$BROWSERS"
          pnpm exec playwright install-deps "${browsers[@]}"

      - name: End-to-end tests
        if: inputs.run-e2e
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure() && inputs.run-e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ${{ inputs.working-directory }}/playwright-report/
            ${{ inputs.working-directory }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      SEMGREP_VERSION: "1.185.0"
    steps:
      - name: Check out repository (full history for secret scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --quiet
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Audit production dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --prod --audit-level "$AUDIT_LEVEL"

      - name: Static security analysis
        if: inputs.run-semgrep
        working-directory: ${{ inputs.working-directory }}
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          read -r -a rule_sets <<< "$SEMGREP_CONFIG"
          config_args=()
          for rule_set in "${rule_sets[@]}"; do
            config_args+=(--config "$rule_set")
          done
          pipx run "semgrep==${SEMGREP_VERSION}" scan --error --metrics=off "${config_args[@]}" .
