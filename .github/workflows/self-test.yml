# Verifies this repository: lints all workflow files and runs the reusable
# CI pipeline against a minimal fixture project.
name: Self-test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-workflows:
    name: Lint workflows
    permissions:
      contents: read
    uses: $/.github/workflows/lint-workflows.yml

  ci:
    name: Pipeline against fixture
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml
    with:
      working-directory: test/fixture
      run-e2e: false
